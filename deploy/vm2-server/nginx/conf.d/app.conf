# server.mail-or-a.dev → server container (Express API)

# HTTP: serve the ACME challenge, redirect everything else to HTTPS.
server {
    listen 80;
    server_name server.mail-or-a.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS, proxy to the API.
server {
    listen 443 ssl;
    http2 on;
    server_name server.mail-or-a.dev;

    ssl_certificate     /etc/letsencrypt/live/server.mail-or-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.mail-or-a.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Resume uploads (PDF/DOCX via multer) — allow a generous body size.
    client_max_body_size 25m;

    location / {
        proxy_pass http://server:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
