# ──────────────────────────────────────────────────────────────────────────────
# Mailora 2.0 — Production & Cloud-Ready Docker Compose
#
# Production Usage (uses managed cloud Atlas, Upstash Redis, Aiven Kafka):
#   docker compose up -d --build
#
# Optional Full Local Stack (runs local Mongo, Redis, Kafka, Zookeeper):
#   docker compose --profile local-infra up -d --build
#
# Services:
#   - client:           React 19 SPA served via Nginx (Port 80) with API reverse proxy
#   - server:           Main Express API + Kafka consumers + BullMQ workers (Port 5000)
#   - whatsapp-service: WhatsApp messaging microservice with persistent volume (Port 5002)
#   - serpapiservice:   Job search microservice (Port 5001)
# ──────────────────────────────────────────────────────────────────────────────

version: "3.8"

services:
  # ─── Main Express API Server ─────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - server/.env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - WHATSAPP_SERVICE_URL=http://whatsapp-service:5002
      - JOB_SERVICE_URL=http://serpapiservice:5001/api/jobs
    volumes:
      - server_uploads:/app/server/uploads
    restart: unless-stopped

  # ─── Client (React + Nginx with API Proxy) ────────────────────────────────
  client:
    build:
      context: client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  # ─── WhatsApp Microservice ───────────────────────────────────────────────
  whatsapp-service:
    build:
      context: whatsapp-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - whatsapp-service/.env
    volumes:
      - wa_session:/app/.wwebjs_auth
    restart: unless-stopped

  # ─── SerpAPI Job Search Microservice ─────────────────────────────────────
  serpapiservice:
    build:
      context: serpapiservice
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - serpapiservice/.env
    restart: unless-stopped

  # ─── Optional Local Infrastructure (Only with --profile local-infra) ─────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    profiles: ["local-infra"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    profiles: ["local-infra"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mongo:
    image: mongo:7.0
    profiles: ["local-infra"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    profiles: ["local-infra"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  server_uploads:
  wa_session:
  mongo_data:
  redis_data:
